---
name: "Java CI"
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and run tests with maven
        run: mvn -B clean verify -Dmaven.build.cache.enabled=false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: example
          path: example*/**/target/**
